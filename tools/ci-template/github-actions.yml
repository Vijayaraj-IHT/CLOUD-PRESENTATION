name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: Static integrity checks
        run: npm run check

      - name: Build single-file deck
        run: npm run build

      - name: Runtime smoke tests
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          npm test

      - name: Upload deck
        uses: actions/upload-artifact@v4
        with:
          name: cloud-storage-presentation
          path: dist/index.html

# ---------------------------------------------------------------------------
# NOTE: This file is a template, not an active workflow.
# The automation account that created this branch lacks the `workflows`
# permission, so it cannot commit into .github/workflows/.
# To enable CI, copy it into place yourself and commit:
#
#   mkdir -p .github/workflows
#   cp tools/ci-template/github-actions.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "Enable CI"
# ---------------------------------------------------------------------------
